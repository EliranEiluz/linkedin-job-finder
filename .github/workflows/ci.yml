name: CI

# Run on every push to main and on every pull request targeting main. Pushes
# to feature branches are NOT auto-CI'd — open a PR to trigger the run, which
# keeps minutes from being burned on noisy in-progress branches.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same ref cancels the previous in-flight run. Saves
# minutes during rebase-and-force-push iteration on a PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r backend/requirements.txt
          python3 -m pip install ruff mypy pytest pytest-mock pytest-cov responses freezegun

      - name: ruff check
        run: python3 -m ruff check .

      - name: ruff format --check
        run: python3 -m ruff format --check .

      - name: mypy
        run: python3 -m mypy backend/

      # phase_d_test.py is a script-style legacy harness (sys.exit at module
      # level, not pytest-collectable). Restricted explicitly via --ignore so
      # a future glob-based discovery change can't quietly pull it in.
      - name: pytest
        run: python3 -m pytest backend/tests/test_*.py --ignore=backend/tests/phase_d_test.py

  ui:
    name: UI (tsc + eslint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: tsc --noEmit
        run: npx tsc --noEmit

      # eslint with --max-warnings=-1 fails ONLY on errors; the 35 demoted
      # react-hooks v7 advisories stay as warnings and don't break CI. We
      # surface them in the log so reviewers see them, but don't gate on
      # them — see ui/eslint.config.js for why each is warn rather than error.
      - name: eslint
        run: npx eslint .

      - name: vitest
        run: npx vitest run

      - name: build
        run: npm run build
